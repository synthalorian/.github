name: Bug report
description: Something is broken or wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report the facts. Blackshield Company.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / tag
      placeholder: e.g. v0.2.0
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - Windows
        - macOS
        - Nexus Mod Manager / Vortex / MO2
        - Other
        - N/A
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or extra context
    validations:
      required: false
